manifest:

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: hubble
      url-base: https://github.com/HubbleNetwork

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      # Same pin as the BLE workspace (firmware/zephyr). The satellite SoC
      # driver in the SDK selects its nrfx_timer reference on ZEPHYR_VERSION,
      # and v4.4.0 is the branch it was validated against.
      revision: v4.4.0
      import: true
      west-commands: scripts/west-commands.yml
    - name: hubblenetwork-sdk
      repo-path: sdk
      # Pinned to a commit rather than a tag. The newest tag (v3.0.0-rc1)
      # predates 370f513 "sat: packet: Fix symbol clobbered by ECC lookup",
      # without which every transmitted packet has its last 6 data symbols
      # overwritten by Reed-Solomon parity and cannot be decoded or
      # decrypted by the ground station. Do not move this back to a tag
      # until one contains that fix.
      revision: 323ffa50936992bcd7177d99a1c863f38d3a4e44
      path: modules/lib/hubblenetwork-sdk
      remote: hubble
