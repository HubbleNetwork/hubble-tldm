# Reasonable SHELL configuration for this application
CONFIG_SHELL=n

# Logging
CONFIG_LOG=n

# Hubble Network
CONFIG_HUBBLE_SAT_NETWORK=y
CONFIG_HUBBLE_COUNTER_SOURCE_DEVICE_UPTIME=y

# Disable nonce-reuse enforcement. The check persists the sequence counter to
# NVS and rejects reused/decreasing counters; this application transmits
# continuously and needs no NVS.
CONFIG_HUBBLE_NETWORK_SECURITY_ENFORCE_NONCE_CHECK=n

CONFIG_MAIN_STACK_SIZE=4096
