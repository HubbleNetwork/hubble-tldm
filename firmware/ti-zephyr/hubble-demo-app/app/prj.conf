# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# Hubble Network
CONFIG_HUBBLE_BLE_NETWORK=y
CONFIG_HUBBLE_COUNTER_SOURCE_DEVICE_UPTIME=y

# Bluetooth dependencies
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Main stack size
CONFIG_MAIN_STACK_SIZE=2048

# For TI, enforce TinyCrypt usage
CONFIG_HUBBLE_NETWORK_KEY_128=y
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_AES=y
CONFIG_TINYCRYPT_AES_CTR=y
CONFIG_TINYCRYPT_AES_CMAC=y
CONFIG_HUBBLE_NETWORK_CRYPTO_CUSTOM=y
