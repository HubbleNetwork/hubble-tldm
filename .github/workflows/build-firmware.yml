name: Build firmware ELFs

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Open a PR updating merge/*.elf with the build outputs"
        type: boolean
        default: false
  pull_request:
    paths:
      - "firmware/**"
      - "merge/md.json"
      - ".github/workflows/build-firmware.yml"
      - ".github/scripts/verify-firmware-elf.py"

# Build jobs only need read; only the open-pr job pushes a branch.
permissions:
  contents: read

# Cancel superseded PR builds; never cancel manual dispatches (releases).
concurrency:
  group: build-firmware-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 0.17.x breaks the TI fork's libc-hooks.c (CLAUDE.md gotcha) — keep at 0.16.9.
  ZEPHYR_SDK_VERSION_TI: "0.16.9"

  # Add new build workspaces here. Each workspace needs a build job below.
  WORKSPACES: '["zephyr","ti-zephyr","sat-zephyr","sat-freertos-ti"]'

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate md.json build fields
        run: |
          missing=$(jq -r '
            to_entries[]
            | select((.value.workspace // "") == "" or (.value.board_target // "") == "" or (.value.artifact // "") == "")
            | .key
          ' merge/md.json)
          if [ -n "$missing" ]; then
            echo "::error::merge/md.json entries missing workspace/board_target/artifact: $missing"
            exit 1
          fi
          unknown=$(jq -r --argjson workspaces "$WORKSPACES" '
            to_entries[]
            | select((.value.workspace | IN($workspaces[])) | not)
            | "\(.key)=\(.value.workspace)"
          ' merge/md.json)
          if [ -n "$unknown" ]; then
            echo "::error::merge/md.json has entries with unknown workspace (expected one of $WORKSPACES): $unknown"
            exit 1
          fi

      - name: Build matrices from md.json
        id: matrix
        run: |
          matrix=$(jq -c --argjson workspaces "$WORKSPACES" '
            [$workspaces[] as $w | {
              ($w): [to_entries[] | select(.value.workspace == $w) | {key, board_target: .value.board_target, artifact: .value.artifact}]
            }] | add
          ' merge/md.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  build-zephyr:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.setup-matrix.outputs.matrix)['zephyr'] }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: hubble-demo-app
          base-path: firmware/zephyr
          toolchains: arm-zephyr-eabi

      # SiLabs boards (e.g. bg22_ek4108a) require a connectivity-firmware blob
      # that west blobs treats as opt-in. Fetching unconditionally is a no-op
      # for boards that don't need it.
      - name: Fetch HAL blobs
        working-directory: firmware/zephyr
        run: west blobs fetch hal_silabs

      - name: Build firmware
        working-directory: firmware/zephyr
        env:
          BOARD_TARGET: ${{ matrix.board.board_target }}
          ARTIFACT: ${{ matrix.board.artifact }}
        run: |
          west build -b "$BOARD_TARGET" -p always hubble-demo-app/app
          cp build/zephyr/zephyr.elf "$GITHUB_WORKSPACE/$ARTIFACT"

      - name: Verify ELF symbols
        env:
          ARTIFACT: ${{ matrix.board.artifact }}
        run: python .github/scripts/verify-firmware-elf.py "$ARTIFACT"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elfs-${{ matrix.board.key }}
          path: ${{ matrix.board.artifact }}
          if-no-files-found: error
          retention-days: 14

  build-ti-zephyr:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.setup-matrix.outputs.matrix)['ti-zephyr'] }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ti-simplelink-crc-tool is invoked by the TI Zephyr build for hex
      # signing; pull it in before action-zephyr-setup runs west update.
      - name: Install TI workspace Python requirements
        run: pip install -r firmware/ti-zephyr/hubble-demo-app/requirements.txt

      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: hubble-demo-app
          base-path: firmware/ti-zephyr
          sdk-version: ${{ env.ZEPHYR_SDK_VERSION_TI }}
          toolchains: arm-zephyr-eabi

      - name: Build firmware
        working-directory: firmware/ti-zephyr
        env:
          BOARD_TARGET: ${{ matrix.board.board_target }}
          ARTIFACT: ${{ matrix.board.artifact }}
        run: |
          west build -b "$BOARD_TARGET" -p always hubble-demo-app/app
          cp build/zephyr/zephyr.elf "$GITHUB_WORKSPACE/$ARTIFACT"

      - name: Verify ELF symbols
        env:
          ARTIFACT: ${{ matrix.board.artifact }}
        run: python .github/scripts/verify-firmware-elf.py "$ARTIFACT"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elfs-${{ matrix.board.key }}
          path: ${{ matrix.board.artifact }}
          if-no-files-found: error
          retention-days: 14

  build-sat-zephyr:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.setup-matrix.outputs.matrix)['sat-zephyr'] }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: hubble-sat-app
          base-path: firmware/sat-zephyr
          toolchains: arm-zephyr-eabi

      # Nordic SoCs link a prebuilt Hubble satellite radio library. Silicon Labs
      # SoCs instead compile the radio from source against RAIL, which ships in
      # hal_silabs. west update pulls in neither, and the link fails without them.
      - name: Fetch satellite blobs
        working-directory: firmware/sat-zephyr
        run: |
          west blobs fetch hubblenetwork-sdk
          west blobs fetch hal_silabs

      - name: Build firmware
        working-directory: firmware/sat-zephyr
        env:
          BOARD_TARGET: ${{ matrix.board.board_target }}
          ARTIFACT: ${{ matrix.board.artifact }}
        run: |
          west build -b "$BOARD_TARGET" -p always hubble-sat-app/app
          cp build/zephyr/zephyr.elf "$GITHUB_WORKSPACE/$ARTIFACT"

      - name: Verify ELF symbols
        env:
          ARTIFACT: ${{ matrix.board.artifact }}
        run: python .github/scripts/verify-firmware-elf.py "$ARTIFACT"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elfs-${{ matrix.board.key }}
          path: ${{ matrix.board.artifact }}
          if-no-files-found: error
          retention-days: 14

  build-sat-freertos-ti:
    needs: setup-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/hubblenetwork/ti-ci-docker:9.20.00.81
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.setup-matrix.outputs.matrix)['sat-freertos-ti'] }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Hubble Device SDK
        working-directory: firmware/sat-freertos-ti
        run: |
          SDK_REV="$(cat sdk-revision)"
          echo "Pinned SDK revision: $SDK_REV"
          git clone --depth 1 --branch "$SDK_REV" https://github.com/HubbleNetwork/hubble-device-sdk.git hubble-device-sdk

      - name: Build firmware
        working-directory: firmware/sat-freertos-ti/hubble-sat-app
        env:
          BOARD_TARGET: ${{ matrix.board.board_target }}
          ARTIFACT: ${{ matrix.board.artifact }}
        run: |
          make -f "${BOARD_TARGET}.mk"
          cp build/hubble-sat-app.out "$GITHUB_WORKSPACE/$ARTIFACT"

      # action-zephyr-setup installs pyelftools, but FreeRTOS-TI still needs to install it
      - name: Verify ELF symbols
        env:
          ARTIFACT: ${{ matrix.board.artifact }}
        run: |
          pip install pyelftools
          python3 .github/scripts/verify-firmware-elf.py "$ARTIFACT"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elfs-${{ matrix.board.key }}
          path: ${{ matrix.board.artifact }}
          if-no-files-found: error
          retention-days: 14

  open-pr:
    needs: [build-zephyr, build-ti-zephyr, build-sat-zephyr, build-sat-freertos-ti]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all firmware ELFs into merge/
        uses: actions/download-artifact@v4
        with:
          path: merge
          pattern: firmware-elfs-*
          merge-multiple: true

      - name: Show pending changes
        run: |
          ls -la merge/
          git status

      - name: Build PR body
        id: body
        env:
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "body<<PR_EOF"
            echo "Automated rebuild of \`merge/*.elf\` from workflow run [#${RUN_ID}](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})."
            echo
            echo "**Boards rebuilt:**"
            jq -r 'to_entries[] | "- `\(.key)` (\(.value.workspace)) → `\(.value.artifact)`"' merge/md.json
            echo
            echo "**Reviewer checklist** — merging publishes new firmware to every \`pyhubbledemo\` user:"
            echo "- [ ] Diff contains only \`merge/*.elf\` changes"
            echo "- [ ] Spot-check at least one ELF locally with \`hubbledemo flash\` against real hardware"
            echo "- [ ] Confirm SDK versions in workflow match the intended release toolchain"
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automated/firmware-build-${{ github.run_id }}
          title: "chore(merge): rebuild firmware ELFs"
          body: ${{ steps.body.outputs.body }}
          add-paths: merge/*.elf
          commit-message: "chore(merge): rebuild firmware ELFs from workflow ${{ github.run_id }}"
          delete-branch: true
